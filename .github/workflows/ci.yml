name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Version smoke test
        run: swift run -c release dayglass --version
