name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      TAP_REPO_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin_path="$(swift build -c release --show-bin-path)"
          mkdir -p dist
          cp "$bin_path/dayglass" dist/dayglass
          tar -C dist -czf "dist/dayglass-${version}-macos-arm64.tar.gz" dayglass
          shasum -a 256 "dist/dayglass-${version}-macos-arm64.tar.gz" > dist/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/dayglass-*.tar.gz dist/checksums.txt --generate-notes
      - name: Notify Homebrew tap
        if: ${{ env.TAP_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.TAP_REPO_TOKEN }}
        run: gh api repos/Gigooo-organization/homebrew-dayglass/dispatches -f event_type=dayglass-release -f "client_payload[tag]=$GITHUB_REF_NAME"
